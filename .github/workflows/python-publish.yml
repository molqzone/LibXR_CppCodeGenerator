name: CI/CD - Python Package

on:
  push:
    paths:
      - "**.py"
      - "**.toml"
      - "**.yml"
      - "**.xml"
  pull_request:
    paths:
      - "**.py"
      - "**.toml"
      - "**.yml"
      - "**.xml"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A new ruff release may format differently; move the pin on purpose.
      - run: python -m pip install ruff==0.16.9
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts

  libxr-version:
    name: Pin the LibXR commit
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pin.outputs.commit }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The package and the STM32 target test share this one file, so the
      # published default LibXR commit is the one that was tested.
      - name: Write libxr_version.py
        id: pin
        run: |
          commit=$(python ./scripts/gen_libxr_version.py)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: libxr-version
          path: src/libxr/libxr_version.py
          if-no-files-found: error

  release-version:
    name: Check release tag matches package version
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare tag and pyproject version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          tag_version = tag[1:] if tag[:1] in ("v", "V") else tag
          if tag_version != version:
              sys.exit(f"Release tag {tag} does not match package version {version}")
          print(f"Release tag {tag} matches package version {version}")
          PY

  discover-stm32-targets:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - name: Checkout STM32 Test Projects
        uses: actions/checkout@v4
        with:
          repository: Jiu-xiao/libxr_stm32_test
          path: test-project

      - name: Discover STM32 targets
        id: targets
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          root = Path("test-project")
          targets = sorted(
              path.name
              for path in root.iterdir()
              if path.is_dir() and not path.name.startswith(".")
              and (path / "CMakeLists.txt").is_file()
          )
          if not targets:
              raise SystemExit("No STM32 target directories found")

          print("matrix=" + json.dumps({"target": targets}, separators=(",", ":")))
          PY

  stm32-target-test:
    name: STM32 Target (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs:
      - discover-stm32-targets
      - libxr-version
    container:
      image: ghcr.io/xrobot-org/docker-image-stm32:main
      options: --user 0

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-stm32-targets.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: libxr-version
        path: src/libxr

    - name: Install Python Package
      run: pip install .

    - name: Compiler Version Check
      run: |
        arm-none-eabi-gcc --version
        starm-clang --version

    - name: Get Test Projects
      uses: actions/checkout@v4
      with:
        repository: Jiu-xiao/libxr_stm32_test
        path: test-project

    - name: Resolve matching LibXR ref
      id: libxr-ref
      shell: bash
      run: |
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          # A release tests the LibXR commit that the package pins.
          ref="${{ needs.libxr-version.outputs.commit }}"
        else
          ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if ! git ls-remote --exit-code --heads https://github.com/xrobot-org/libxr.git "refs/heads/${ref}" >/dev/null; then
            ref="dev"
          fi
        fi
        echo "Using LibXR ref: ${ref}"
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"

    - name: Run STM32 target test
      run: |
        cd test-project && ./test.sh "${{ steps.libxr-ref.outputs.ref }}" "${{ matrix.target }}"

  build:
    name: Build & Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: libxr-version

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - uses: actions/download-artifact@v4
        with:
          name: libxr-version
          path: src/libxr

      - name: Build Package
        run: python -m build

      - name: Check Package Metadata
        run: twine check dist/*

      # Every matrix entry builds the same pure-Python distribution; publish
      # exactly one of them so artifacts cannot replace each other.
      - name: Upload Built Package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

      - name: Install built package (Linux)
        if: runner.os != 'Windows'
        run: |
          pip install dist/*.whl || pip install dist/*.tar.gz

      - name: Install built package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist\*.whl,dist\*.tar.gz | Select-Object -First 1
          if ($pkg) {
            pip install $pkg.FullName
          }

      # The tests import every module of the installed package (src layout), so a module
      # missing from the wheel fails them.
      - name: Candidate source regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Checkout BSP Compatibility Test Repo
        uses: actions/checkout@v4
        with:
          repository: xrobot-org/bsp_stm32f103
          path: bsp_test

      - name: Python Compatibility Check (Linux)
        if: runner.os != 'Windows'
        run: |
          cd bsp_test
          libxr stm32 setup -d .

      - name: Python Compatibility Check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location bsp_test
          libxr stm32 setup -d .

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - lint
      - release-version
      - build
      - stm32-target-test
    if: github.event_name == 'release'

    permissions:
      id-token: write

    environment:
      name: XRobot
      url: https://pypi.org/project/libxr

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: List built packages
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.TOKEN }}

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libxr"
version = "6.0.0"
description = "C++ code generator for LibXR-based embedded systems, supporting STM32 and modular robotics applications."
requires-python = ">=3.8"
authors = [
    {name = "Xiao", email = "2592509183@qq.com"}
]
maintainers = [
    {name = "Xiao", email = "2592509183@qq.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["code generation", "embedded systems", "automation"]
dependencies = [
    "pyyaml",
    "requests",
    "packaging",
    "ruamel.yaml>=0.17.21,<0.19",
    "xr-syntax==0.2.0"
]

[project.urls]
Homepage = "https://github.com/xrobot-org/libxr"
Documentation = "https://xrobot.work/"
Repository = "https://github.com/xrobot-org/LibXR_CppCodeGenerator"
"Bug Tracker" = "https://github.com/xrobot-org/LibXR_CppCodeGenerator/issues"

[project.scripts]
xr_parse_ioc = "libxr.peripheral_analyzer_stm32:main"
xr_parse = "libxr.peripheral_analyzer:main"
xr_gen_code_stm32 = "libxr.generator_code_stm32:main"
xr_gen_code = "libxr.generator_code:main"
xr_stm32_cmake = "libxr.generator_stm32_cmake:main"
xr_stm32_flash = "libxr.stm32_flash_generator:main"
xr_stm32_toolchain_switch = "libxr.stm32_toolchain_switch:main"
xr_cubemx_cfg = "libxr.config_cubemx_project:main"
xr_cubemx_generate = "libxr.cubemx_generator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"libxr" = ["libxr_version.py", "STM32FlashLayoutRules.xml"]
